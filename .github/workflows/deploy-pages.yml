name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Rebase public sprite paths for GitHub Pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'dist';
          const extensions = new Set(['.css', '.html', '.js']);

          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath);
                continue;
              }
              if (!extensions.has(path.extname(entry.name))) continue;

              const before = fs.readFileSync(fullPath, 'utf8');
              const after = before.replaceAll('/sprites/', '/math-rogue/sprites/');
              if (after !== before) fs.writeFileSync(fullPath, after);
            }
          };

          walk(root);
          NODE

      - name: Remove source assets from Pages artifact
        run: npm run cleanup:dist-assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
