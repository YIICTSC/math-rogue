name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/android-*
    paths:
      - .github/workflows/build-android.yml
      - android/**
      - src/**
      - public/**
      - scripts/prepare-android-dist.mjs
      - scripts/generate-android-icons.mjs
      - capacitor.config.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile

      - name: Build paid Android web assets
        run: pnpm run build:android

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Restore upload keystore
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/learning-rogue-upload.p12"

      - name: Build release app bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/learning-rogue-upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: PKCS12
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: learning-rogue-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
