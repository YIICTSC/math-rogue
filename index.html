
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="学習ローグ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>学習ローグ</title>
    <style>
      @font-face {
        font-family: 'DotGothic16';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/DotGothic16-Regular.ttf') format('truetype');
      }
      :root {
        --pixel-font: 'DotGothic16', 'MS Gothic', monospace;
      }
      body {
        font-family: var(--pixel-font);
        background-color: #000;
        /* Prevent selection and tap highlights for app-like feel */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Re-enable selection for inputs */
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
      .pixel-art {
        image-rendering: pixelated;
      }
      .crt-scanline {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af; 
      }

      /* Marquee Animation for Scrolling Text */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        animation: marquee 6s linear infinite;
      }
      @keyframes marquee-half {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee-scroll {
        animation: marquee-half 6s linear infinite;
      }

      /* Sinister Aura for True Boss */
      @keyframes sinister-pulse {
        0% { filter: drop-shadow(0 0 10px #7e22ce) drop-shadow(0 0 20px #9d174d); transform: scale(1) translateY(0); }
        50% { filter: drop-shadow(0 0 30px #a855f7) drop-shadow(0 0 50px #db2777); transform: scale(1.05) translateY(-5px); }
        100% { filter: drop-shadow(0 0 10px #7e22ce) drop-shadow(0 0 20px #9d174d); transform: scale(1) translateY(0); }
      }
      .sinister-aura {
        animation: sinister-pulse 3s infinite ease-in-out;
      }
      @keyframes void-spin {
        from { transform: rotate(0deg) scale(2); opacity: 0.3; }
        to { transform: rotate(360deg) scale(2.2); opacity: 0.5; }
      }
      .void-backglow {
        animation: void-spin 10s linear infinite;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <aside id="startup-status" role="status" style="position:fixed;inset:0;display:none;place-content:center;gap:16px;padding:24px;background:#020617;color:#e2e8f0;text-align:center;font:16px sans-serif;z-index:2147483647">
      <strong>学習ローグ / Learning Rogue</strong>
      <span id="startup-message"></span>
      <button id="startup-retry" hidden style="padding:14px;border-radius:8px;background:#67e8f9;color:#020617;border:0;font:inherit">再読み込み / Reload</button>
    </aside>
    <script>
      (() => {
        const root = document.getElementById('root');
        const panel = document.getElementById('startup-status');
        const message = document.getElementById('startup-message');
        const retry = document.getElementById('startup-retry');
        let recovering = false;
        let failed = false;
        const ready = () => root.childElementCount > 0;
        const observer = new MutationObserver(() => { if (ready()) { panel.remove(); observer.disconnect(); clearTimeout(timer); } });
        observer.observe(root, {childList:true});
        const showFailure = () => { if (!ready()) { failed = true; panel.style.display = 'grid'; message.textContent = '読み込みを完了できませんでした。セーブを保持して再読み込みできます。 / Loading failed. Reload without deleting saves.'; retry.hidden = false; } };
        const reload = async () => {
          if (recovering) return;
          recovering = true; retry.disabled = true;
          message.textContent = '保存済みデータを使って再読み込みしています… / Reloading with saved data…';
          // A busy classroom connection is not evidence of corrupt storage.
          // Preserve cached downloads, saves, invitation parameters and hashes.
          location.reload();
        };
        retry.addEventListener('click', reload);
        window.addEventListener('error', event => {
          if (ready() || failed) return;
          showFailure();
        }, true);
        window.addEventListener('unhandledrejection', showFailure);
        const timer = setTimeout(() => {
          if (ready() || failed) return;
          panel.style.display = 'grid';
          message.textContent = '読み込み中です。通信が混み合っている場合は、このままお待ちください。 / Still loading. Please wait while the connection is busy.';
        }, 20000);
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
