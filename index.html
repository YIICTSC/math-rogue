
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>学習ローグ</title>
    <style>
      @font-face {
        font-family: 'DotGothic16';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/DotGothic16-Regular.ttf') format('truetype');
      }
      :root {
        --pixel-font: 'DotGothic16', 'MS Gothic', monospace;
      }
      body {
        font-family: var(--pixel-font);
        background-color: #000;
        /* Prevent selection and tap highlights for app-like feel */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Re-enable selection for inputs */
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
      .pixel-art {
        image-rendering: pixelated;
      }
      .crt-scanline {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af; 
      }

      /* Marquee Animation for Scrolling Text */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        animation: marquee 6s linear infinite;
      }
      @keyframes marquee-half {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee-scroll {
        animation: marquee-half 6s linear infinite;
      }

      /* Sinister Aura for True Boss */
      @keyframes sinister-pulse {
        0% { filter: drop-shadow(0 0 10px #7e22ce) drop-shadow(0 0 20px #9d174d); transform: scale(1) translateY(0); }
        50% { filter: drop-shadow(0 0 30px #a855f7) drop-shadow(0 0 50px #db2777); transform: scale(1.05) translateY(-5px); }
        100% { filter: drop-shadow(0 0 10px #7e22ce) drop-shadow(0 0 20px #9d174d); transform: scale(1) translateY(0); }
      }
      .sinister-aura {
        animation: sinister-pulse 3s infinite ease-in-out;
      }
      @keyframes void-spin {
        from { transform: rotate(0deg) scale(2); opacity: 0.3; }
        to { transform: rotate(360deg) scale(2.2); opacity: 0.5; }
      }
      .void-backglow {
        animation: void-spin 10s linear infinite;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
