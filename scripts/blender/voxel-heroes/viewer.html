<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学習ローグ • 主人公モデル確認</title>
<style>*{box-sizing:border-box}body{margin:0;background:#18242d;color:#e7eceb;font:15px system-ui,sans-serif;display:grid;grid-template-columns:300px 1fr;height:100dvh}aside{padding:22px;overflow:auto;background:#20323c}h1{font-size:19px}p{line-height:1.7}select,button,a{font:inherit;color:inherit}select,button{border:1px solid #67828c;background:#283f4a;border-radius:7px;padding:9px;margin:3px 0;max-width:100%}button{cursor:pointer}button:hover{background:#46616a}#reference{display:block;max-width:100%;height:260px;object-fit:contain;margin:20px auto;background:#d5dee1;border-radius:10px}main{position:relative;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}#tag{position:absolute;bottom:14px;left:16px;font-size:13px;color:#d2e2e4;pointer-events:none}a{color:#b5dcca}#status{color:#b5dcca;font-size:13px}body.capture{display:block;height:512px;width:512px}body.capture aside,body.capture #tag{display:none}body.capture main{height:512px;width:512px}@media(max-width:700px){body:not(.capture){grid-template-columns:1fr;grid-template-rows:60dvh 40dvh}main{grid-row:1}aside{grid-row:2;padding:12px}#reference{height:170px;float:right;width:30%}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<aside><h1>学習ローグ<br>35人のボクセル主人公</h1><select id="hero" aria-label="主人公"></select><p id="name"></p><img id="reference" alt="元の通常イラスト"><p id="feature"></p><div id="views"></div><p>動作 <select id="motion"><option value="">静止</option><option>Idle</option><option>Walk</option><option>Jump</option><option>Attack</option></select></p><button id="play">再生 / 停止</button><p id="status">読み込み中…</p><p><a id="blend">Blender</a> · <a id="glb">GLB</a> · <a href="index.html">画像一覧</a></p><small>ドラッグで回転・ホイールまたはピンチで拡大。背景・照明は確認用です。ゲーム本編には未組み込み。</small></aside>
<main><canvas></canvas><div id="tag">学習ローグ / 実際のGLBモデル</div></main>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const capture=new URLSearchParams(location.search).has('capture');if(capture)document.body.classList.add('capture');
const canvas=document.querySelector('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(capture?1:Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;
const scene=new THREE.Scene();scene.background=new THREE.Color('#293c48');scene.fog=new THREE.Fog('#293c48',8,20);const camera=new THREE.OrthographicCamera(-1.12,1.12,1.12,-1.12,.1,50);
scene.add(new THREE.HemisphereLight('#f2f4ed','#7b8c91',2.0));
function light(color,power,pos,shadow=false){const l=new THREE.DirectionalLight(color,power);l.position.set(...pos);l.castShadow=shadow;if(shadow){l.shadow.mapSize.set(1024,1024);l.shadow.camera.left=-2;l.shadow.camera.right=2;l.shadow.camera.top=3;l.shadow.camera.bottom=-1;l.shadow.normalBias=.018;l.shadow.bias=-.0002;l.shadow.radius=3;}scene.add(l);return l;}
light('#fff0d7',2.5,[-3,5,4],true);light('#b0cee6',.8,[4,3,1]);light('#fae7cf',1.5,[1,4,-4]);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#344953',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.006;floor.receiveShadow=true;scene.add(floor);
const controls=new OrbitControls(camera,canvas);controls.target.set(0,.97,0);controls.minDistance=1;controls.maxDistance=12;controls.minZoom=.5;controls.maxZoom=3;controls.enablePan=false;controls.addEventListener('change',draw);
let model,mixer,clips=[],playing=false,current='',time=0,clock=new THREE.Clock(),request=0;
function draw(){renderer.render(scene,camera)}
function resize(){const r=canvas.parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);const a=r.width/r.height;camera.left=-1.12*a;camera.right=1.12*a;camera.top=1.12;camera.bottom=-1.12;camera.updateProjectionMatrix();draw()};window.addEventListener('resize',resize);
const views={front:[0,.02],back:[180,.02],side:[90,.02],'three-quarter':[35,.15],gameplay:[155,.42]};
function view(name){const [angle,el]=views[name];const a=angle*Math.PI/180;camera.position.set(Math.sin(a)*5,.97+el*5,Math.cos(a)*5);controls.target.set(0,.97,0);camera.zoom=1;camera.updateProjectionMatrix();camera.lookAt(controls.target);controls.update();draw()}
function pose(name='',t=0){playing=false;current=name;time=t;mixer?.stopAllAction();if(name){const clip=THREE.AnimationClip.findByName(clips,name);if(!clip)throw Error('Missing clip '+name);const action=mixer.clipAction(clip);action.play();mixer.setTime(t);}model?.updateMatrixWorld(true);draw()}
const designs=await(await fetch('./catalog.json')).json();const select=document.getElementById('hero');for(const d of designs){const o=document.createElement('option');o.value=d.id;o.textContent=d.name+' / '+d.id.split('-')[0];select.append(o)}
function bounds(){model.updateMatrixWorld(true);const b=new THREE.Box3();model.traverse(o=>{if(o.isSkinnedMesh){o.skeleton.update();const v=new THREE.Vector3();for(let i=0;i<o.geometry.attributes.position.count;i++){o.getVertexPosition(i,v);v.applyMatrix4(o.matrixWorld);b.expandByPoint(v)}}});return {min:b.min.toArray(),max:b.max.toArray()}}
async function load(id){const seq=++request;const gltf=await new GLTFLoader().loadAsync('./'+id+'/'+id+'.glb');if(seq!==request)return;if(model){mixer?.stopAllAction();mixer?.uncacheRoot(model);scene.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of [].concat(o.material))m.dispose()}})}model=gltf.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});clips=gltf.animations;mixer=new THREE.AnimationMixer(model);const d=designs.find(d=>d.id===id);select.value=id;document.getElementById('name').textContent=d.name;document.getElementById('feature').textContent=d.feature;document.getElementById('reference').src='./references/'+d.image;document.getElementById('blend').href='./'+id+'/'+id+'.blend';document.getElementById('glb').href='./'+id+'/'+id+'.glb';document.getElementById('motion').value='';pose();view('three-quarter');document.getElementById('status').textContent=`${clips.length}動作 / ${renderer.info.render.triangles-2}三角形`;return {id,clips:clips.map(c=>({name:c.name,duration:c.duration})),bounds:bounds()}}
select.onchange=()=>load(select.value);for(const [id,label]of [['front','正面'],['back','背面'],['side','側面'],['three-quarter','斜め'],['gameplay','ゲーム視点']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>view(id);document.getElementById('views').append(b)}
document.getElementById('motion').onchange=e=>{pose(e.target.value);playing=!!e.target.value};document.getElementById('play').onclick=()=>{if(!current)pose('Idle');playing=!playing};
function tick(){requestAnimationFrame(tick);const dt=clock.getDelta();if(playing){time+=Math.min(.05,dt);mixer.update(Math.min(.05,dt));draw()}}if(!capture)tick();resize();await load(new URLSearchParams(location.search).get('id')||designs[0].id);window.heroReview={load,pose,view,bounds,draw,designs,renderer,model:()=>model};window.ready=true;
</script></html>
